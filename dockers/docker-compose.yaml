services:
  app:
    build:
      # Build context is the repository root so the Dockerfile can copy src/.
      context: ..
      dockerfile: dockers/Dockerfile
    image: langgraph-mcp-agent:0.5.0
    ports:
      # Bound to loopback. This app launches MCP servers as subprocesses, so it
      # must not be exposed directly; put a reverse proxy with TLS and real
      # authentication in front of it before making it reachable.
      - "127.0.0.1:8585:8585"
    volumes:
      - ./data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
      # Login is on by default. The app refuses to render a login form when
      # USER_ID/USER_PASSWORD are unset, so it fails closed rather than open.
      - USE_LOGIN=${USE_LOGIN:-true}
      - USER_ID=${USER_ID:?set USER_ID in dockers/.env}
      - USER_PASSWORD=${USER_PASSWORD:?set USER_PASSWORD in dockers/.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in dockers/.env}
      # In-app MCP tool registration spawns subprocesses; opt in deliberately.
      - MCP_ALLOW_TOOL_EDIT=${MCP_ALLOW_TOOL_EDIT:-false}
      - MCP_ALLOWED_COMMANDS=${MCP_ALLOWED_COMMANDS:-}
      # Conversations persist to the ./data volume, alongside config.json.
      - CHECKPOINT_DB_PATH=${CHECKPOINT_DB_PATH:-/app/data/checkpoints.db}
      # Profiles live on the volume too. The image sets this; passing it here
      # as well means an operator can move the file without rebuilding, and
      # the default is not the read-only /app layer, where nothing can write.
      - MCP_PROFILES_PATH=${MCP_PROFILES_PATH:-/app/data/profiles.json}
      # --- Shell capability -------------------------------------------------
      # Off. Turning it on lets the agent run commands; read docs/PROFILES.md
      # before you do, and note that the container below has no Docker socket,
      # so the sandbox this app wants is not reachable from inside it.
      - MCP_ENABLE_SHELL=${MCP_ENABLE_SHELL:-false}
      # Only `host` is meaningful here, and only alongside the warning above:
      # it runs the model's commands as this container's own process.
      - MCP_SHELL_POLICY=${MCP_SHELL_POLICY:-}
      # The one directory a profile may mount. Unset means a profile gets a
      # temporary directory no matter what it asks for.
      - MCP_WORKSPACE_ROOT=${MCP_WORKSPACE_ROOT:-}
      - MCP_SANDBOX_IMAGE=${MCP_SANDBOX_IMAGE:-}
      - PROMPT_CACHE_TTL=${PROMPT_CACHE_TTL:-}
      - MCP_TOOL_TIMEOUT=${MCP_TOOL_TIMEOUT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NODE_OPTIONS=${NODE_OPTIONS:-}
    env_file:
      - ./.env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    healthcheck:
      # Streamlit serves its readiness probe at /_stcore/health. There is no
      # /healthz — an earlier version of this file probed one, so the
      # container reported unhealthy for its whole life.
      test: ["CMD", "curl", "--fail", "http://localhost:8585/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
