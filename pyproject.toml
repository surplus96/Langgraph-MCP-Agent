[project]
name = "langgraph-mcp-agents"
version = "0.3.0"
description = "LangGraph ReAct agent with MCP tool adapters, served through Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.1",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.2.11",
    "mcp[cli]>=1.24.0,<2.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    # Windows ships no system timezone database, so zoneinfo needs this.
    # examples/mcp_server_time.py depends on it.
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
